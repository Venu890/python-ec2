name: Enterprise DevSecOps Pipeline - AWS EC2

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'dev'
  workflow_dispatch:

jobs:
  # STAGE 1: Code Quality & Syntax Linting
  lint:
    name: 🔍 1. Code Quality & Syntax (Flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Syntax Check
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # STAGE 2: Automated Unit Testing
  unit_test:
    name: 🧪 2. Automated Unit Testing (Pytest)
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Python Dependencies (Context & hashFiles)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest -v

  # STAGE 3: Static Application Security Testing (SAST)
  sast_scan:
    name: 🛡️ 3. Code Security SAST Scan (Bandit)
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Code SAST Scan
        run: |
          bandit -r app.py -s B104

  # STAGE 4: Software Composition Analysis (SCA)
  sca_scan:
    name: 📦 4. Dependency SCA Audit (Snyk)
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk Open Source (SCA) Scan & Monitor
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

  # STAGE 5: Docker Container Image Build & Verification
  container_scan:
    name: 🐳 5. Docker Image Build & Verification
    needs: [sast_scan, sca_scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image for Inspection
        run: |
          docker build -t python-ec2-app:latest .

      - name: Verify Docker Container Build Integrity
        run: |
          docker images | grep python-ec2-app

  # STAGE 6: Production AWS EC2 Deployment
  prod_deploy:
    name: 🚀 6. Production AWS EC2 Deployment
    needs: [sast_scan, sca_scan, container_scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            APP_DIR="/home/${{ vars.EC2_USERNAME }}/python-ec2-app"
            mkdir -p $APP_DIR
            
            if ! command -v docker &> /dev/null; then
              echo "Docker not found! Installing Docker on EC2..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ${{ vars.EC2_USERNAME }} || true
            fi

            cd $APP_DIR

            if [ -d ".git" ]; then
              echo "Pulling latest code..."
              git fetch --all
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            echo "Building Docker image..."
            sudo docker build -t python-ec2-app:latest .

            echo "Stopping old container..."
            sudo docker stop python-ec2-app || true
            sudo docker rm python-ec2-app || true

            echo "Starting new container..."
            sudo docker run -d \
              --name python-ec2-app \
              --restart always \
              -p 80:5000 \
              python-ec2-app:latest

            sudo docker image prune -f

            echo "Deployment successfully completed!"
