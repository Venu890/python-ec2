name: Enterprise DevSecOps Pipeline - AWS EC2

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'dev'
  workflow_dispatch:

jobs:
  # JOB 1: Code Linting & Syntax Validation
  lint:
    name: 🔍 Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Syntax Check
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # JOB 2: Automated Unit Testing
  test:
    name: 🧪 Automated Unit Testing (Pytest)
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -v

  # JOB 3: Security & Dependency Audit (SCA / SAST)
  security_scan:
    name: 🛡️ DevSecOps Security Scan (Snyk & Bandit)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run SAST Code Scan (Bandit)
        run: |
          # Scan python code for security issues (skip B104 0.0.0.0 container binding false-positive)
          bandit -r app.py -s B104

      - name: Run Snyk Open Source (SCA) Security Scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # JOB 4: Automated EC2 Deployment
  deploy:
    name: 🚀 Production EC2 Deployment
    needs: [test, security_scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # App directory path
            APP_DIR="/home/${{ vars.EC2_USERNAME }}/python-ec2-app"
            mkdir -p $APP_DIR
            
            # Check and install Docker automatically if not present
            if ! command -v docker &> /dev/null; then
              echo "Docker not found! Installing Docker on EC2..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ${{ vars.EC2_USERNAME }} || true
            fi

            # Navigate to app directory
            cd $APP_DIR

            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "Pulling latest code..."
              git fetch --all
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Build Docker Image
            echo "Building Docker image..."
            sudo docker build -t python-ec2-app:latest .

            # Stop and remove existing container if running
            echo "Stopping old container..."
            sudo docker stop python-ec2-app || true
            sudo docker rm python-ec2-app || true

            # Run new container (mapping EC2 port 80 to container port 5000)
            echo "Starting new container..."
            sudo docker run -d \
              --name python-ec2-app \
              --restart always \
              -p 80:5000 \
              python-ec2-app:latest

            # Prune old images to save disk space
            sudo docker image prune -f

            echo "Deployment successfully completed!"
