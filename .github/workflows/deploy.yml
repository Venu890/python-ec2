name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -v

  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Create app directory if not exists
            APP_DIR="/home/${{ secrets.EC2_USERNAME }}/python-ec2-app"
            mkdir -p $APP_DIR
            
            # Navigate to app directory
            cd $APP_DIR

            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "Pulling latest code..."
              git fetch --all
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Build Docker Image
            echo "Building Docker image..."
            docker build -t python-ec2-app:latest .

            # Stop and remove existing container if running
            echo "Stopping old container..."
            docker stop python-ec2-app || true
            docker rm python-ec2-app || true

            # Run new container (mapping EC2 port 80 to container port 5000)
            echo "Starting new container..."
            docker run -d \
              --name python-ec2-app \
              --restart always \
              -p 80:5000 \
              python-ec2-app:latest

            # Prune old images to save disk space
            docker image prune -f

            echo "Deployment successfully completed!"
